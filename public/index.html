<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Vicky Kumar — AI Portfolio Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #ffffff;   /* page background */
  --s1:       #f6f8fb;   /* assistant bubble + typing surface */
  --s2:       #ffffff;   /* input row, header buttons */
  --s3:       #eef2f7;   /* welcome chips, soft surfaces */
  --ub:       #eaf0ff;   /* user bubble */
  --ub-bd:    #c8d4f4;   /* user bubble border */
  --b1:       #e4e7ee;   /* subtle border */
  --b2:       #cfd5e0;   /* stronger border */
  --g:        #0a8a5b;   /* green accent (deep mint) */
  --g-soft:   rgba(10,138,91,0.10);
  --b:        #2954e8;   /* blue accent */
  --b-soft:   rgba(41,84,232,0.10);
  --p:        #d63384;   /* pink/magenta accent */
  --tx:       #0b1220;   /* primary text */
  --tx2:      #475067;   /* secondary text */
  --tx3:      #8c95a8;   /* tertiary / hints */
  --glow:     rgba(10,138,91,0.18);
  --shadow:   0 1px 2px rgba(11,18,32,0.04), 0 1px 1px rgba(11,18,32,0.03);
  --r:        12px;
  --r-sm:     7px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow: hidden; }
body {
  height: 100%; height: 100dvh;
  background: var(--bg); color: var(--tx);
  font-family: 'IBM Plex Mono', monospace;
  display: flex; flex-direction: column;
  overflow: hidden;
  padding-bottom: env(safe-area-inset-bottom);
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(circle, rgba(11,18,32,0.06) 1px, transparent 1px);
  background-size: 26px 26px; pointer-events: none; z-index: 0;
}
.blob { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
.blob-1 { top:-100px; left:-60px; width:420px; height:420px; background: radial-gradient(circle,rgba(41,84,232,0.10) 0%,transparent 70%); }
.blob-2 { bottom:-80px; right:-40px; width:360px; height:360px; background: radial-gradient(circle,rgba(10,138,91,0.10) 0%,transparent 70%); }
@media (max-width:480px){ .blob { display:none; } }

header {
  position: relative; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; height: 56px; flex-shrink: 0;
  background: rgba(255,255,255,0.92); border-bottom: 1px solid var(--b1);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
}
.h-left { display:flex; align-items:center; gap:10px; min-width:0; text-decoration:none; color:inherit; cursor:pointer; }
.h-left:hover .h-info h1 { color:var(--g); transition: color 0.18s; }
.avatar {
  width:36px; height:36px; border-radius:9px; flex-shrink:0;
  background: linear-gradient(135deg,#eafaf1,#d6f4e3); border: 1px solid rgba(10,138,91,0.25);
  display:flex; align-items:center; justify-content:center;
  font-family:'Outfit',sans-serif; font-size:12px; font-weight:900;
  color: var(--g); position:relative;
  box-shadow: var(--shadow);
}
.avatar::after {
  content:''; position:absolute; bottom:-2px; right:-2px;
  width:8px; height:8px; background:var(--g);
  border-radius:50%; border:2px solid var(--bg);
  animation: hbeat 2.4s ease-in-out infinite;
}
@keyframes hbeat { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.3);opacity:0.5} }
.h-info { min-width:0; overflow:hidden; }
.h-info h1 { font-family:'Outfit',sans-serif; font-size:14px; font-weight:900; color:var(--tx); letter-spacing:-.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.h-info p { font-size:8px; color:var(--g); letter-spacing:1.8px; text-transform:uppercase; white-space:nowrap; }
.h-right { display:flex; align-items:center; gap:6px; flex-shrink:0; }
.hbtn {
  display:flex; align-items:center; gap:5px; padding:5px 10px;
  border:1px solid var(--b1); border-radius:var(--r-sm);
  background:var(--s2); color:var(--tx2);
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:500;
  text-decoration:none; transition:all 0.18s; cursor:pointer; white-space:nowrap;
}
.hbtn:hover { border-color:var(--g); color:var(--g); background:var(--g-soft); }
.hbtn svg { width:12px; height:12px; fill:currentColor; flex-shrink:0; }
@media (max-width:420px){ .hbtn span { display:none; } .hbtn { padding:5px 7px; } }

.chat-wrap { flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; z-index: 1; min-height: 0; }

#messages {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 16px 12px 8px;
  display: flex; flex-direction: column; gap: 12px;
  scroll-behavior: smooth; min-height: 0;
}
@media (min-width:600px){ #messages { padding:20px 20px 10px; gap:14px; } }
#messages::-webkit-scrollbar { width:4px; }
#messages::-webkit-scrollbar-track { background:transparent; }
#messages::-webkit-scrollbar-thumb { background:var(--b2); border-radius:4px; }

.welcome {
  background: linear-gradient(135deg,#f7faff,#ffffff);
  border: 1px solid var(--b1); border-radius: var(--r);
  padding: 22px 18px 20px; text-align: center;
  position: relative; overflow:hidden;
  animation: fadeUp 0.45s ease both;
  width: 100%; max-width: 560px; align-self: center;
  box-shadow: var(--shadow);
}
@media (min-width:600px){ .welcome { padding:28px 28px 24px; } }
.welcome::before { content:''; position:absolute; top:0; left:15%; right:15%; height:1px; background:linear-gradient(90deg,transparent,var(--g),transparent); }
.w-tag { display:inline-block; padding:3px 11px; margin-bottom:12px; border:1px solid rgba(10,138,91,0.30); border-radius:100px; background:var(--g-soft); color:var(--g); font-size:8px; letter-spacing:2px; text-transform:uppercase; }
.welcome h2 { font-family:'Outfit',sans-serif; font-size: clamp(18px,5vw,26px); font-weight:900; line-height:1.15; margin-bottom:9px; background:linear-gradient(135deg,var(--tx) 30%,var(--g)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.welcome p { font-size:10.5px; color:var(--tx2); line-height:1.8; max-width:380px; margin:0 auto 18px; }
.welcome p strong { color:var(--b); font-weight:600; }
.chips-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; }
@media (max-width:340px){ .chips-grid { grid-template-columns:1fr; } }
.wchip { padding:9px 11px; background:var(--s3); border:1px solid var(--b1); border-radius:var(--r-sm); font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:500; color:var(--tx2); cursor:pointer; transition:all 0.18s; text-align:left; display:flex; align-items:center; gap:7px; }
.wchip:hover, .wchip:active { border-color:var(--b); color:var(--b); background:var(--b-soft); transform:translateY(-1px); }

@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.msg { display:flex; gap:8px; animation: fadeUp 0.22s ease both; }
.msg.assistant { align-items:flex-start; width:100%; }
.msg.assistant .bubble { flex:1; min-width:0; background:var(--s1); border-color:var(--b1); border-bottom-left-radius:3px; box-shadow: var(--shadow); }
.msg.user { align-items:flex-start; flex-direction:row-reverse; align-self:flex-end; max-width:82%; }
@media (min-width:600px){ .msg.user { max-width:72%; } }
.msg.user .bubble { background:var(--ub); border-color:var(--ub-bd); border-bottom-right-radius:3px; }

.msg-av {
  width:28px; height:28px; border-radius:7px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;

}
.msg.user .msg-av { background:linear-gradient(135deg,#2954e8,#1c3fbe); color:#fff; }
.msg.assistant .msg-av { background:linear-gradient(135deg,#eafaf1,#d6f4e3); border:1px solid rgba(10,138,91,0.25); color:var(--g); font-family:'Outfit',sans-serif; font-size:9px; font-weight:900; }

.bubble {
  padding:11px 14px; border-radius:var(--r);
  font-size:12.5px; line-height:1.78;
  border:1px solid; color:var(--tx);
  word-break:break-word; overflow-wrap:anywhere;
}
@media (min-width:600px){ .bubble { padding:13px 16px; font-size:13px; } }

.bubble a { color:var(--b); text-decoration:none; border-bottom:1px solid rgba(41,84,232,0.35); }
.bubble a:hover { border-color:var(--b); }
.bubble code { background:var(--g-soft); padding:1px 5px; border-radius:4px; font-size:11.5px; color:var(--g); }
.bubble p { margin-bottom:0.6em; }
.bubble p:last-child { margin-bottom:0; }
.bubble ul, .bubble ol { padding-left:1.3em; margin:0.4em 0 0.6em; }
.bubble li { margin-bottom:0.3em; line-height:1.7; }
.bubble strong { color:var(--tx); font-weight:600; }
.bubble h3 { font-family:'Outfit',sans-serif; font-size:13px; font-weight:700; color:var(--g); margin:0.8em 0 0.3em; }
.bubble h4 { font-size:12px; font-weight:600; color:var(--b); margin:0.6em 0 0.2em; }
.bubble hr { border:none; border-top:1px solid var(--b1); margin:0.8em 0; }

.cursor { display:inline-block; width:7px; height:13px; background:var(--g); border-radius:2px; margin-left:2px; vertical-align:text-bottom; animation:blink 0.85s steps(1) infinite; }
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

.typing { display:flex; gap:8px; align-items:flex-start; animation:fadeUp 0.22s ease both; }
.typing-dots { padding:12px 15px; display:flex; align-items:center; gap:5px; background:var(--s1); border:1px solid var(--b1); border-radius:var(--r); border-bottom-left-radius:3px; box-shadow:var(--shadow); }
.typing-dots span { width:5px; height:5px; border-radius:50%; animation:tdot 1.3s ease-in-out infinite; }
.typing-dots span:nth-child(1){ background:var(--g); animation-delay:0s; }
.typing-dots span:nth-child(2){ background:var(--b); animation-delay:0.15s; }
.typing-dots span:nth-child(3){ background:var(--p); animation-delay:0.3s; }
@keyframes tdot{ 0%,70%,100%{transform:translateY(0);opacity:0.3} 35%{transform:translateY(-5px);opacity:1} }

.sugg-bar {
  flex-shrink:0; display:flex; gap:6px; align-items:center;
  overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
  padding:7px 12px; border-top:1px solid var(--b1);

}
.sugg-bar::-webkit-scrollbar { display:none; }
@media (min-width:600px){ .sugg-bar { padding:7px 20px; } }
.schip { flex-shrink:0; padding:5px 11px; background:var(--s2); border:1px solid var(--b1); border-radius:100px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:500; color:var(--tx2); cursor:pointer; transition:all 0.18s; white-space:nowrap; user-select:none; }
.schip:hover,.schip:active { border-color:var(--g); color:var(--g); background:var(--g-soft); }

.input-wrap {
  flex-shrink:0; padding:10px 12px;
  background:rgba(255,255,255,0.95); border-top:1px solid var(--b1);
  z-index:10; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  padding-left: max(12px, env(safe-area-inset-left));
  padding-right: max(12px, env(safe-area-inset-right));
}
@media (min-width:600px){ .input-wrap { padding:12px 20px; } }
.input-row {
  display:flex; gap:8px; align-items:flex-end;
  background:var(--s2); border:1px solid var(--b1); border-radius:var(--r);

.input-row:focus-within { border-color:var(--g); box-shadow:0 0 0 3px var(--glow); }
#inp {

#inp::-webkit-scrollbar{ display:none; }
#inp::placeholder{ color:var(--tx3); }
#send {
  width:34px; height:34px; flex-shrink:0; border-radius:var(--r-sm);
  background:linear-gradient(135deg,#0a8a5b,#13a26c);
  border:1px solid rgba(10,138,91,0.30);

#send svg{ width:15px; height:15px; fill:currentColor; }
.input-hint { text-align:center; font-size:8.5px; color:var(--tx3); margin-top:6px; letter-spacing:0.3px; line-height:1.5; }
</style>

<script>
const msgEl  = document.getElementById('messages');
const inp    = document.getElementById('inp');
const sndBtn = document.getElementById('send');
let history  = [];
let loading  = false;
let welcomed = false;

(function () {

  c.className = 'welcome'; c.id = 'welcome';
  c.innerHTML = `
    <div class="w-tag">AI Portfolio Agent</div>

       Ask me anything. No LinkedIn redirects. Real data, real fast.</p>
    <div class="chips-grid">
      <button class="wchip" onclick="chip('Tell me about Vicky\\'s work experience')"><span>💼</span>Work Experience</button>
      <button class="wchip" onclick="chip('What is Vicky\\'s tech stack?')"><span>🛠</span>Skills &amp; Stack</button>
      <button class="wchip" onclick="chip('Show me all of Vicky\\'s projects')"><span>🚀</span>Projects</button>
      <button class="wchip" onclick="chip('How can I contact Vicky?')"><span>📬</span>Contact Info</button>
    </div>`;
  msgEl.appendChild(c);
})();

function scrollBot() { msgEl.scrollTop = msgEl.scrollHeight; }

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/**
 * Block-level markdown renderer. Used for the final pass once the
 * full reply has arrived so partial-markdown flicker is avoided.
 */
function render(raw) {
  let text = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = text.split('\n');
  let html = '';
  let listItems = [];
  let listType = null;
  let paraLines = [];

  function flushList() {
    if (listItems.length === 0) return;
    const tag = listType === 'ol' ? 'ol' : 'ul';
    html += `<${tag}>` + listItems.map(li => `<li>${inlineRender(li)}</li>`).join('') + `</${tag}>`;
    listItems = []; listType = null;
  }

  function flushPara() {
    if (paraLines.length === 0) return;
    const content = paraLines.join(' ').trim();
    if (content) html += `<p>${inlineRender(content)}</p>`;
    paraLines = [];
  }

  for (const line of lines) {
    const trimmed = line.trim();

    if (/^###\s/.test(trimmed)) { flushPara(); flushList(); html += `<h3>${inlineRender(trimmed.slice(4))}</h3>`; continue; }
    if (/^##\s/.test(trimmed))  { flushPara(); flushList(); html += `<h3>${inlineRender(trimmed.slice(3))}</h3>`; continue; }
    if (/^#\s/.test(trimmed))   { flushPara(); flushList(); html += `<h3>${inlineRender(trimmed.slice(2))}</h3>`; continue; }
    if (/^---+$/.test(trimmed) || /^\*\*\*+$/.test(trimmed)) { flushPara(); flushList(); html += '<hr>'; continue; }

    const ulMatch = trimmed.match(/^[-*•]\s+(.+)/);
    if (ulMatch) {
      flushPara();
      if (listType !== 'ul') { flushList(); listType = 'ul'; }
      listItems.push(ulMatch[1]);
      continue;
    }

    const olMatch = trimmed.match(/^\d+\.\s+(.+)/);
    if (olMatch) {
      flushPara();
      if (listType !== 'ol') { flushList(); listType = 'ol'; }
      listItems.push(olMatch[1]);
      continue;
    }

    if (trimmed === '') { flushPara(); flushList(); continue; }

    flushList();
    paraLines.push(trimmed);
  }

  flushPara(); flushList();
  return html || `<p>${inlineRender(text.trim())}</p>`;
}

function inlineRender(s) {
  return esc(s)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/(https?:\/\/[^\s<"&]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

/** Lightweight render used while tokens are arriving. */
function renderStream(raw) {
  return esc(raw)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/(https?:\/\/[^\s<"&]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/\n/g, '<br>');
}

function mkAv(role) {
  const d = document.createElement('div');
  d.className = 'msg-av';
  d.textContent = role === 'user' ? '👤' : 'VK';
  return d;
}

function addUser(text) {
  if (!welcomed) {
    const wc = document.getElementById('welcome');
    if (wc) {
      wc.style.transition = 'opacity 0.28s';
      wc.style.opacity = '0';
      setTimeout(() => wc.remove(), 280);
    }
    welcomed = true;
  }
  const w = document.createElement('div');
  w.className = 'msg user';
  const b = document.createElement('div');
  b.className = 'bubble'; b.innerHTML = render(text);
  w.appendChild(mkAv('user')); w.appendChild(b);
  msgEl.appendChild(w); scrollBot();
}

function showTyping() {
  const w = document.createElement('div');
  w.className = 'typing'; w.id = 'typing';
  const av = document.createElement('div');
  av.className = 'msg-av';
  av.style.cssText = 'width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#0f2218,#1a4030);border:1px solid rgba(79,255,176,0.2);display:flex;align-items:center;justify-content:center;font-family:Outfit,sans-serif;font-size:9px;font-weight:900;color:#4fffb0;flex-shrink:0;margin-top:2px';
  av.textContent = 'VK';
  const d = document.createElement('div');
  d.className = 'typing-dots';
  d.innerHTML = '<span></span><span></span><span></span>';
  w.appendChild(av); w.appendChild(d);
  msgEl.appendChild(w); scrollBot();
}
function hideTyping() { const t = document.getElementById('typing'); if(t) t.remove(); }

function addError(msg) {
  const w = document.createElement('div');
  w.className = 'msg assistant';
  const b = document.createElement('div');
  b.className = 'bubble'; b.style.color = '#ff6b9d';
  b.textContent = '⚠️  ' + msg;
  w.appendChild(mkAv('assistant')); w.appendChild(b);
  msgEl.appendChild(w); scrollBot();
}

async function sendMsg() {
  const text = inp.value.trim();
  if (!text || loading) return;

  loading = true;
  sndBtn.disabled = true;
  inp.value = ''; inp.style.height = 'auto';
  inp.style.fontSize = '13px';

  addUser(text);
  history.push({ role:'user', content:text });
  showTyping();

  let fullText = '';

  try {
    const res = await fetch('/api/chat-stream', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ message:text, history:history.slice(-10) }),
    });

    hideTyping();

    if (!res.ok) {
      let detail = 'Something went wrong. Please try again.';
      try { const e = await res.json(); detail = e.detail || detail; } catch(_){}
      addError(detail); return;
    }

    const w = document.createElement('div');
    w.className = 'msg assistant';
    const bub = document.createElement('div');
    bub.className = 'bubble';
    bub.innerHTML = '<span class="cursor"></span>';
    w.appendChild(mkAv('assistant')); w.appendChild(bub);
    msgEl.appendChild(w); scrollBot();

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      fullText += decoder.decode(value, { stream:true });
      bub.innerHTML = renderStream(fullText) + '<span class="cursor"></span>';
      scrollBot();
    }

    bub.innerHTML = render(fullText);
    history.push({ role:'assistant', content:fullText });

  } catch(e) {
    hideTyping();
    addError('Network error. Make sure the server is running.');
  } finally {
    loading = false;
    sndBtn.disabled = false;
    inp.focus();
  }
}

function chip(text) { inp.value = text; sendMsg(); }

inp.addEventListener('input', () => {
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 108) + 'px';
});
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
inp.addEventListener('focus', () => { inp.style.fontSize = '16px'; });
inp.addEventListener('blur',  () => { inp.style.fontSize = '13px'; });
document.addEventListener('touchmove', e => {
  if (!msgEl.contains(e.target)) e.preventDefault();
}, { passive:false });

inp.focus();
</script>
</body>
</html>
